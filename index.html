<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Google</title>
    <meta name="description" content="Google homepage replica - The Odin Project" />
    <link rel="icon" href="assets/favicon.svg" type="image/svg+xml" />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <!-- Top navigation -->
    <header class="top-nav">
      <nav class="top-nav__links">
        <a href="#" class="top-nav__link">Gmail</a>
        <a href="#" class="top-nav__link">Images</a>
        <button class="top-nav__apps" aria-label="Google apps" title="Google apps">
          <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path
              fill="#5f6368"
              d="M6 8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6-8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm6-8c1.1 0 2-.9 2-2s-.9-2-2-2-2 .9-2 2 .9 2 2 2zm0 2c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2zm0 6c-1.1 0-2 .9-2 2s.9 2 2 2 2-.9 2-2-.9-2-2-2z"
            />
          </svg>
        </button>
        <a href="#" class="top-nav__signin">Sign in</a>
      </nav>
    </header>

    <!-- Main search area -->
    <main class="search">
      <img class="search__logo" src="assets/google-logo.svg" alt="Google" />

      <form class="search__form" action="https://www.google.com/search" method="get" role="search">
        <div class="search__box">
          <svg class="search__icon" viewBox="0 0 24 24" width="20" height="20" aria-hidden="true">
            <path
              fill="#9aa0a6"
              d="M15.5 14h-.79l-.28-.27a6.5 6.5 0 1 0-.7.7l.27.28v.79l5 4.99L20.49 19l-4.99-5zm-6 0A4.5 4.5 0 1 1 14 9.5 4.49 4.49 0 0 1 9.5 14z"
            />
          </svg>
          <input
            class="search__input"
            type="text"
            name="q"
            aria-label="Search"
            autocomplete="off"
            autofocus
          />
          <svg class="search__mic" viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
            <path fill="#4285f4" d="M12 15c1.66 0 3-1.34 3-3V6c0-1.66-1.34-3-3-3S9 4.34 9 6v6c0 1.66 1.34 3 3 3z" />
            <path fill="#34a853" d="M11 18.08h2V21h-2z" />
            <path fill="#fbbc05" d="M7.05 16.87c-1.27-1.33-2.05-2.83-2.05-4.87h1.7c0 1.66.65 2.87 1.59 3.87l-1.24 1z" />
            <path fill="#ea4335" d="M12 16.5c-2.49 0-4.5-2.01-4.5-4.5H6c0 3.31 2.69 6 6 6s6-2.69 6-6h-1.5c0 2.49-2.01 4.5-4.5 4.5z" />
          </svg>
        </div>

        <div class="search__buttons">
          <button class="search__button" type="submit">Google Search</button>
          <button class="search__button" type="button" onclick="feelingLucky()">I'm Feeling Lucky</button>
        </div>
      </form>
    </main>

    <!-- Footer -->
    <footer class="footer">
      <div class="footer__row footer__row--top">
        <span>United States</span>
      </div>
      <div class="footer__row footer__row--bottom">
        <nav class="footer__links footer__links--left">
          <a href="#">About</a>
          <a href="#">Advertising</a>
          <a href="#">Business</a>
          <a href="#">How Search works</a>
        </nav>
        <nav class="footer__links footer__links--right">
          <a href="#">Privacy</a>
          <a href="#">Terms</a>
          <a href="#">Settings</a>
        </nav>
      </div>
    </footer>

    <script src="script.js"></script>
  </body>
</html>
